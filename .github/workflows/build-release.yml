name: Build & Release Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2.2'
          build-root-directory: android

      - name: Build Android Release APK
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p build-artifacts
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} build-artifacts/tubegrab.apk \;

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build-artifacts/tubegrab.apk

  build-desktop:
    name: Build Windows Desktop App
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install electron-builder
        run: npm install --no-save electron-builder

      - name: Build Windows Installer
        run: npx electron-builder --win nsis:x64 --publish never

      - name: Prepare Desktop Asset
        shell: pwsh
        run: |
          mkdir -p build-artifacts
          $exe = Get-ChildItem -Path dist/*.exe | Select-Object -First 1
          if ($exe) {
            Copy-Item $exe.FullName -Destination build-artifacts/tubegrab-setup.exe
          }

      - name: Upload Desktop Installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-exe
          path: build-artifacts/tubegrab-setup.exe

  release:
    name: Publish GitHub Release
    needs: [build-android, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets/

      - name: Download Desktop Artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-exe
          path: release-assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: TubeGrab ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }} Official Release
          body: |
            ## 🚀 TubeGrab v1.0.0
            Official production releases for **TubeGrab**:
            * 📱 **Android**: `tubegrab.apk` - Native YouTube-style mobile app
            * 💻 **Windows**: `tubegrab-setup.exe` - Native desktop installer (x64)
            * 🌐 **Web**: https://tubegrab-narwal.web.app
          files: |
            release-assets/tubegrab.apk
            release-assets/tubegrab-setup.exe
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
